exclude: '.git|.tox'
default_stages: [pre-commit]
fail_fast: true

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        types_or: [python, rst, markdown]
        files: ^src/

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        files: ^src/

      - id: pyupgrade
        name: pyupgrade
        entry: uv run pyupgrade
        language: system
        args: [--py311-plus]
        files: ^src/

      - id: black
        name: black
        entry: uv run black
        language: system
        files: ^src/

      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        files: ^src/
