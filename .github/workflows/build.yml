name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.5"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-in-project: true
        virtualenvs-path: .venv

    - name: Set up Python 3.12
      run: uv python install

    - name: Cache pre-commit
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Cache mypy
      uses: actions/cache@v4
      with:
        path: .mypy_cache/
        key: mypy_cache-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

    - name: Install dependencies
      run: uv sync --all-extras --test

    - name: pre-commit
      run: |
        uv run pre-commit run -a

    - name: Mypy
      run: |
        uv run mypy --incremental --no-install-types --show-error-codes --pretty src tests

    - name: Tests
      run: |
        uv run coverage run -m pytest --cov-config=.coveragerc

    - name: Tests coverage
      run: |
        uv run coverage html
        uv run coverage xml
        uv run coverage report --show-missing

    # Requires CODECOV_TOKEN in repository secrets
    - name: Upload codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}  # Only required for private repositories
        file: ./coverage.xml
        fail_ci_if_error: true
